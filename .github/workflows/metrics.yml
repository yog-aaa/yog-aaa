name: GitHub Metrics

on:
  schedule:
    # Runs every day at 00:00 UTC / 07:00 WIB (Asia/Jakarta)
    - cron: "0 0 * * *"

  # Allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yog-aaa
          filename: metrics/overview.svg

          template: classic
          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Jakarta
          config_display: large

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yog-aaa
          filename: metrics/isocalendar.svg

          base: ""
          config_timezone: Asia/Jakarta

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate language metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: yog-aaa
          filename: metrics/languages.svg

          base: ""
          config_timezone: Asia/Jakarta

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
